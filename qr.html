<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_qr">Generador QR | DBlog</title>
    <link rel="preload" as="image" href="img/logo.webp">

    <link rel="icon" href="img/logo.webp" type="image/webp">
    <link rel="stylesheet" href="style.css">

    <meta property="og:title" content="David Sánchez Isabel | Ingeniero de Telecomunicaciones">
    <meta property="og:description" content="Portfolio técnico: Redes, Software y Sistemas. Explora mis proyectos y mi terminal interactiva.">
    <meta property="og:image" content="img/logo.webp"> <meta property="og:url" content="https://dsanchezisabel.github.io/my_web/">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header id="header-principal" class="scrolled">
        <nav>
            <a href="index.html" class="contenedor-logo" title="Volver al inicio">
                <img src="img/logo.webp" alt="Avatar" class="foto-nav" loading="lazy">
                <span class="logo-texto">David Sánchez Isabel</span>
            </a>
            <div class="nav-controles">
                <button id="btn-lang" class="btn-tema" style="font-weight: bold; font-family: var(--fuente-titulos);">EN</button>
                <button id="btn-tema" class="btn-tema" aria-label="Cambiar tema"><i class="fas fa-moon"></i></button>
            </div>
        </nav>
    </header>

    <main class="pantalla-completa-centrada">
        <section class="seccion qr-seccion">
            <div class="tarjeta-proyecto texto-centrado">
                <h1 class="titulo-qr" data-i18n="qr_titulo">Generador de QR</h1>
                <p class="subtitulo-qr" data-i18n="qr_subtitulo">Introduce un enlace y descarga la imagen instantáneamente.</p>
                <input type="url" id="inputUrl" class="qr-input" placeholder="Ej. https://www.linkedin.com/in/david..." required>
                <button class="boton qr-btn" id="btn-generar-qr" data-i18n="qr_btn">
                    <i class="fas fa-qrcode"></i> Generar y Descargar QR
                </button>
                <p id="mensaje-estado" class="qr-mensaje"></p>
                <div id="qr-oculto" style="display: none;"></div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" class="btn-filtro"><i class="fas fa-arrow-left"></i> <span data-i18n="btn_volver">Volver al Inicio</span></a>
            </div>
        </section>
    </main>
    <script src="lang.js"></script>
    <script src="script.js"></script>
</body>

</html>
